name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Lint / Type-Check / Test / Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            portaudio19-dev \
            python3-pyaudio \
            ffmpeg \
            libsndfile1

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy --ignore-missing-imports .

      - name: Run tests
        run: |
          pytest -q || test_rc=$?
          if [ "${test_rc:-0}" -eq 5 ]; then
            echo "Warning: No tests were collected"
            exit 0
          elif [ "${test_rc:-0}" -ne 0 ]; then
            exit $test_rc
          fi

      - name: Dependency audit (pip-audit)
        run: |
          pip-audit --format=json > audit.json || true

      - name: Upload pip-audit results
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit
          path: audit.json
