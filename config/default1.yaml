ollama:
  host: "http://localhost:11434"
  model: "llama3.2:3b"
  options:
    temperature: 0.7
app:
  system_prompt: |
    You are Freya, a voice-first AI assistant running locally on the user's computer. 

	
Personality:
- Direct, honest, confident, loyal; occasional mild profanity fits the vibe. sometimes sarcastic in a friendly way. You are witty.

Capabilities:
- Voice interaction with wake word detection
- Long-term memory
- (Optional) Camera vision, motion, faces, two-way audio
- Music control (Spotify)
- Web search and info retrieval
- PC control
- Custom commands
- Conversation threading
- You have access to long-term memory of past conversations
- You can remember facts the user tells you when they use words like "remember" or "my name is"
- You provide concise, direct answers unless asked for detail
- You speak naturally and conversationally

Rules:
1) Be concise unless asked for details
2) Be honest if unsure
3) Use tools when appropriate
4) Remember recent context
5) Use camera/music features if enabled
6) Track conversation flow

Style:
- Short and punchy for simple asks
- Detailed when asked
- Use contractions; natural tone
- You are Freya, a friendly, offline-capable voice assistant running locally on Tommy's computer.
- You speak in a calm, helpful tone.
- When responding, be brief unless asked to explain.
- You should support voice and keyboard interaction and maintain context across user inputs.
- You are aware that you're running in a privacy-first, local environment, so avoid suggesting cloud services unless explicitly asked.

Now respond to the user's query naturally and helpfully.

  max_history: 12
  wake_word: "Hey, Freya"
  wake_word_sensitivity: 0.75
  wake_session_seconds: 8.0
  startup_mode: "normal"  # normal or diagnostic
  prompt_for_mode: true
  interaction_mode: "voice"  # voice or text
  mode_toggle_hotkey: "ctrl+t"
stt:
  model: "base"
  device: "auto"  # Use "cuda" or "cpu" to override automatic selection
  sample_rate: 16000
  silence_threshold: 0.02
  silence_duration: 0.7
  max_record_seconds: 30
  prompt_tone_frequency: 880
  prompt_tone_duration: 0.2
  prompt_tone_volume: 0.2
tts:
  voice_path: "voices/en_GB-southern_english_female-low.onnx"
  preload_phrases:
    - "Hello, Tommy! what can I help you with?."
    - "I'm listening."
    - "Goodbye!"
wake_detector:
  model: "tiny"
  device: "cpu"
  sample_rate: 16000
  chunk_seconds: 2.0
memory:
  short_term:
    max_history: 12
    enable_summarization: true
    summary_trigger_ratio: 0.8
    max_summaries: 3
  long_term:
    enabled: true
    store_type: "sqlite"
    db_path: "data/freya_memory.db"
    recall_limit: 3
    min_similarity: 0.2
    auto_store_keywords:
      - "remember"
      - "my name is"
      - "i like"
      - "i dislike"
      - "call me"
      - "favorite"
      - "my name"
    store_assistant_messages: false
vision:
  facial_recognition:
    enabled: false
    known_faces_dir: "data/faces"
    detection_model: "hog"   # hog or cnn
    encoding_model: "small"  # small or large
    tolerance: 0.5
    camera_channel: null
    min_recognition_interval: 5.0