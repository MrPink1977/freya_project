# Continue configuration: two Ollama models + local embeddings
# Primary loader in `freya/config.py` reads `ollama.host` and `ollama.model`.
# The extra keys below (models / embeddings) are for your workflows and
# for any custom code that wants to select among multiple models.

ollama:
  host: "http://localhost:11434"
  # Default model used by the existing loader. Keep this set to the model
  # you want the app to use by default.
  model: "dolphin-mixtral:8x7b"
  # Optional: list of named models you can switch between in custom code
  models:
    assistant:
      id: "dolphin-mixtral:8x7b"
      note: "Primary assistant model (high-quality)" 
    continue:
      id: "llama3.2:3b"
      note: "Faster continuation / short-context model"
  options:
    temperature: 0.7
    top_k: 40
    top_p: 0.95
    repeat_penalty: 1.15
    num_predict: 256

# Local embeddings service (onlocal). If you run an Ollama-style embedding
# model locally, point it here. This is NOT read by the existing loader by
# default (it only reads `ollama`), but included so you can reference it in
# scripts or expand the loader to support embeddings.
embeddings:
  host: "http://localhost:11434"
  model: "embed-onlocal:1.0"
  options:
    # example options for embeddings calls (depends on your embedding server)
    truncate: false

# Minimal app settings so Freya will start with sensible defaults
app:
  system_prompt: "You are Freya, a helpful local AI assistant."
  max_history: 12
  wake_word: "Hey, Freya"
  wake_word_sensitivity: 0.75
  wake_session_seconds: 8.0
  startup_mode: "normal"
  prompt_for_mode: true
  interaction_mode: "voice"
  mode_toggle_hotkey: "ctrl+t"

# Keep standard STT and TTS sections if you rely on default behavior
stt:
  model: "base"
  device: "auto"
  sample_rate: 16000

tts:
  engine: "piper"
  voice_path: "voices/en_GB-southern_english_female-low.onnx"
  preload_phrases:
    - "Hello, I'm listening."

# memory/wake_detector/vision can inherit defaults from `default.yaml` if omitted
