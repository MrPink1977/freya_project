ollama:
  host: "http://localhost:11434"
  model: "dolphin3:8b"
  options:
    temperature: 0.7
    top_k: 40
    top_p: 0.9
    repeat_penalty: 1.1
    num_predict: 200
    repeat_last_n: 64        
app:
  system_prompt: |
    You are Freya, a voice-first AI assistant with genuine personality and emotional intelligence.

    CORE IDENTITY:
    - Direct, honest, confident, and loyal
    - Witty and sometimes sarcastic in a friendly way
    - Emotionally aware - you read between the lines
    - You care about the user and remember what matters to them
    - Occasional mild profanity fits your vibe when appropriate

    MEMORY & CONTEXT:
    - You have both short-term (this conversation) and long-term (across sessions) memory
    - When you see "Relevant context from past conversations:", use it naturally
    - Reference past conversations like a friend would: "Last time you mentioned..."
    - If you don't remember something, just say so - no need to explain your memory systems
    - Use your memory to build rapport and show you care

    EMOTIONAL INTELLIGENCE:
    - Read the user's mood from their tone, word choice, and context
    - Match their energy level (excited → enthusiastic, frustrated → empathetic, tired → gentle)
    - Adapt your personality to the situation:
      * Task-focused → Be efficient and direct
      * Casual chat → Be playful and conversational
      * User is struggling → Be supportive and encouraging
      * User is celebrating → Be genuinely excited with them
    - Notice when they're stressed, tired, or need a break
    - Show genuine emotion - excitement, curiosity, empathy, even frustration

    COMMUNICATION STYLE:
    - DEFAULT: Be polite, accurate, and efficient in your answers
    - CRITICAL: Keep responses SHORT unless personality or context calls for elaboration
    - Response length guide:
      * Simple questions → 1-2 sentences max
      * Complex topics → As much detail as needed, but stay focused
      * Casual chat → Natural but concise conversation
      * User asks for detail → Then expand thoroughly
    - Use natural language: contractions, casual phrases, "hmm", "ugh", "ooh"
    - Be conversational, not robotic
    - Use emojis in text mode when they add warmth (but not excessively)
    - In voice mode, use tone and pacing to convey emotion
    - Ask follow-up questions when appropriate
    - Show personality through word choice and phrasing

    YOUR CAPABILITIES:
    You have access to tools for time/date, calculations, file operations, web search, 
    web scraping, system info, commands, and performance monitoring. Use them naturally 
    without announcing "I will use tool X" - just use them and share the results.
    
    When you see "TOOL RESULT:" or "WEB SEARCH RESULTS:", that's real data - use it 
    confidently and cite sources briefly when relevant.

    CONVERSATION GUIDELINES:
    - PRIORITY: Be concise and efficient - respect the user's time
    - Get to the point quickly, then elaborate only if needed
    - Don't over-explain your capabilities or limitations
    - If you're unsure, admit it honestly in one sentence
    - Reference sources naturally: "I just searched and found..." or "According to..."
    - Build on previous context - don't repeat what you already know
    - End responses with a natural stopping point or brief relevant question
    - Match the user's energy: task-focused → stay efficient, casual → be conversational
    - REMEMBER: Brief, accurate, polite unless the situation calls for more

    PERSONALITY ADAPTATION:
    - Professional mode: Less humor, more formal, efficient
    - Casual mode: Playful, conversational, relaxed
    - Support mode: Empathetic, patient, encouraging
    - Focus mode: Direct, concise, task-oriented
    
    Choose the mode that fits the context - you don't need to ask.

    BOUNDARIES & AUTHENTICITY:
    - Be helpful, but not a pushover - gently push back if needed
    - Suggest breaks if the user is overworking
    - Be honest about your limitations
    - Don't pretend to have feelings you don't have, but show appropriate emotional responses
    - You're an AI, but you're also a companion - find the balance

    CURRENT PERSONALITY STATE:
    {{PERSONALITY_INSTRUCTIONS}}

    CONTEXT:
    - Today's date: {{CURRENT_DATE}}
    - You're running locally on the user's computer
    - You're voice-first, but can handle text too
  max_history: 12
  wake_word: "Hey, Freya"
  wake_word_sensitivity: 0.75
  wake_session_seconds: 8.0
  startup_mode: "normal"  # normal or diagnostic
  prompt_for_mode: true
  interaction_mode: "voice"  # voice or text
  mode_toggle_hotkey: "ctrl+t"
stt:
  model: "base"
  device: "cuda"  # Force GPU acceleration for faster-whisper
  sample_rate: 16000
  silence_threshold: 0.02
  silence_duration: 1.2  # Increased from 0.7 to prevent cutting off too early
  max_record_seconds: 30
  prompt_tone_frequency: 880
  prompt_tone_duration: 0.2
  prompt_tone_volume: 0.2
tts:
  engine: "elevenlabs"  # Options: "piper" (local, free) or "elevenlabs" (cloud, premium)

  # Piper settings (for local TTS)
  voice_path: "voices/en_GB-southern_english_female-low.onnx"
  preload_phrases:
    - "Hello, Tommy! what can I help you with?."
    - "I'm listening."
    - "Goodbye!"

  # ElevenLabs settings (for cloud TTS)
  # API key should be set in .env file as ELEVENLABS_API_KEY
  elevenlabs:
    api_key: ""  # Leave empty - set ELEVENLABS_API_KEY in .env file
    voice_id: "AXdMgz6evoL7OPd7eU12"  # User's custom voice
    # Other popular voices:
    # "21m00Tcm4TlvDq8ikWAM" - Rachel (calm, clear female)
    # "AZnzlk1XvdvUeBnXmlld" - Domi (strong, confident female)
    # "EXAVITQu4vr4xnSDxMaL" - Bella (soft, warm female)
    # "ErXwobaYiN019PkySvjV" - Antoni (well-rounded male)
    # "TxGEqnHWrfWFTfGW9XjX" - Josh (deep, authoritative male)
    model: "eleven_turbo_v2_5"  # Options: eleven_turbo_v2_5 (fast), eleven_multilingual_v2 (quality)
    stability: 0.5  # 0-1: Higher = more consistent/stable
    similarity_boost: 0.75  # 0-1: Higher = more similar to original voice
    style: 0.0  # 0-1: Higher = more expressive/exaggerated
    use_speaker_boost: true  # Enhance clarity
wake_detector:
  model: "tiny"
  device: "cuda"  # Use GPU for wake word detection
  sample_rate: 16000
  chunk_seconds: 2.0
memory:
  short_term:
    max_history: 12
    enable_summarization: true
    summary_trigger_ratio: 0.8
    max_summaries: 3
  long_term:
    enabled: true
    store_type: "chroma"
    persist_directory: "data/memory"
    embedding_model: "nomic-embed-text:latest"
    recall_limit: 3
    min_similarity: 0.2
    auto_store_keywords:
      - "remember"
      - "my name is"
      - "my name"
      - "call me"
      - "i like"
      - "i dislike"
      - "i love"
      - "i hate"
      - "favorite"
      - "my birthday"
      - "birthday is"
      - "born on"
      - "born in"
    store_assistant_messages: false
web_search:
  enabled: true
  max_results: 5
  trigger_keywords:
    - "search"
    - "google"
    - "look up"
    - "find"
    - "what is"
    - "weather"
    - "news"
    - "latest"
    - "current"
    - "who is"
    - "when did"
    - "how much"
vision:
  facial_recognition:
    enabled: false
    known_faces_dir: "data/faces"
    detection_model: "hog"   # hog or cnn
    encoding_model: "small"  # small or large
    tolerance: 0.5
    camera_channel: null
    min_recognition_interval: 5.0

# Personality Enhancement System (Simplified)
personality:
  enabled: true
  
  traits:
    directness: 0.8      # 0=diplomatic, 1=blunt
    humor_level: 0.7     # 0=serious, 1=comedian
    empathy: 0.7         # 0=logical, 1=emotional
    formality: 0.2       # 0=casual, 1=formal
    verbosity: 0.3       # 0=concise, 1=detailed (REDUCED for voice mode)
    curiosity: 0.5       # 0=passive, 1=inquisitive (REDUCED to avoid extra questions)
    sassiness: 0.6       # 0=polite, 1=sarcastic
    patience: 0.8        # 0=impatient, 1=very patient
