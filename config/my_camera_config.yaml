# Freya Multi-Channel Audio Configuration
# Primary mic + Reolink camera at 192.168.0.22

audio:
  channels:
    # Your primary system microphone
    primary:
      type: system
      enabled: true
      device_index: null  # Use system default microphone
      description: "Primary desktop microphone"

    # Your Reolink camera
    camera_main:
      type: reolink
      enabled: true
      ip: "192.168.0.22"
      rtsp_port: 554
      username: "${REOLINK_CAM_USER}"
      password: "${REOLINK_CAM_PASS}"
      description: "Main Reolink camera with 2-way audio"

# Facial recognition from camera feed
vision:
  facial_recognition:
    enabled: true
    camera_channel: "camera_main"  # Use the Reolink camera for face recognition
    known_faces_dir: "data/faces"  # Directory with known face images
    detection_model: "hog"  # "hog" (faster, CPU) or "cnn" (more accurate, needs GPU)
    encoding_model: "small"  # "small" (faster) or "large" (more accurate)
    tolerance: 0.5  # Lower = stricter matching (0.4-0.6 typical)
    min_recognition_interval: 5.0  # Seconds between recognitions per person
