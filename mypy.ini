[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
check_untyped_defs = False
disallow_any_generics = False
no_implicit_optional = False
exclude = (tests/|test_.*\.py$|demo_.*\.py$)

# Modules with optional dependencies or complex types
[mypy-freya.wake]
ignore_errors = True

[mypy-freya.tts]
ignore_errors = True

[mypy-freya.stt]
ignore_errors = True

[mypy-freya.facial_recognition]
ignore_errors = True

[mypy-freya.audio_config]
ignore_errors = True

[mypy-freya.onvif_client]
ignore_errors = True

[mypy-freya.logger]
ignore_errors = True

[mypy-freya.memory]
ignore_errors = True

[mypy-freya.config]
ignore_errors = True

[mypy-freya.ollama_client]
ignore_errors = True

[mypy-freya.orchestrator]
ignore_errors = True

[mypy-freya.system_check]
ignore_errors = True

[mypy-main]
ignore_errors = True

# Test files - excluded via exclude pattern above
