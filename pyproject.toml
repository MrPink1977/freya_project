[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freya-assistant"
version = "0.1.0"
description = "Voice-enabled AI assistant with vision capabilities"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Freya Project Contributors"}
]
keywords = ["voice-assistant", "ai", "ollama", "speech-recognition", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    # Core dependencies
    "requests>=2.32.0",
    "PyYAML>=6.0.0",
    "numpy>=2.2.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.0",
    
    # Audio I/O
    "sounddevice>=0.5.0",
    "soundfile>=0.13.0",
    "PyAudio>=0.2.14",
    
    # Speech-to-Text
    "faster-whisper>=1.2.0",
    "ctranslate2>=4.6.0",
    
    # Text-to-Speech
    "piper-tts>=1.3.0",
    "elevenlabs>=2.23.0",
    
    # LLM & Memory
    "chromadb>=0.4.0",
    "sentence-transformers>=5.1.0",
    "torch>=2.9.0",
    "transformers>=4.57.0",
    
    # Tools & Utilities
    "ddgs>=9.9.0",
    "beautifulsoup4>=4.14.0",
    "lxml>=6.0.0",
    "psutil>=7.1.0",
    
    # Vision (optional but included)
    "opencv-python>=4.12.0",
    "face-recognition>=1.3.0",
    "pillow>=11.3.0",
    
    # Camera/ONVIF
    "onvif-zeep>=0.2.12",
    
    # UI & Controls
    "colorama>=0.4.6",
    "keyboard>=0.13.5",
    "rich>=14.2.0",
    
    # Windows-specific
    "pywin32>=311; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
    "black>=24.0.0",
    "mypy>=1.18.0",
    "types-PyYAML",
    "types-requests",
]
minimal = [
    # Minimal install without vision/face recognition
    "requests>=2.32.0",
    "PyYAML>=6.0.0",
    "numpy>=2.2.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.13.0",
    "faster-whisper>=1.2.0",
    "piper-tts>=1.3.0",
    "elevenlabs>=2.23.0",
    "chromadb>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/MrPink1977/freya_project"
Repository = "https://github.com/MrPink1977/freya_project"
Issues = "https://github.com/MrPink1977/freya_project/issues"

[project.scripts]
freya = "main:main"

[tool.setuptools]
packages = ["freya", "freya.tools"]

[tool.setuptools.package-data]
freya = ["*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E731", "E501", "N818"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
