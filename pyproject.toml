[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freya-assistant"
version = "0.1.0"
description = "Voice-enabled AI assistant with vision capabilities"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Freya Project Contributors"}
]
keywords = ["voice-assistant", "ai", "ollama", "speech-recognition", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "numpy>=1.24.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
    "pyaudio>=0.2.14",
    "colorama>=0.4.6",
    "keyboard>=0.13.5",
    "duckduckgo-search>=6.0.0",
    "sentence-transformers>=2.2.0",
    "opencv-python>=4.8.0",
    "onvif-zeep>=0.2.12",
    "beautifulsoup4>=4.12.0",
    "psutil>=5.9.0",
    "elevenlabs>=1.0.0",
    "pydub>=0.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pip-audit>=2.0.0",
    "types-PyYAML",
    "types-requests",
]
face-recognition = [
    "face_recognition>=1.3.0",
    "dlib>=19.24.0",
]

[project.urls]
Homepage = "https://github.com/MrPink1977/freya_project"
Repository = "https://github.com/MrPink1977/freya_project"
Issues = "https://github.com/MrPink1977/freya_project/issues"

[project.scripts]
freya = "main:main"

[tool.setuptools]
packages = ["freya", "freya.tools"]

[tool.setuptools.package-data]
freya = ["*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E731", "E501", "N818"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
